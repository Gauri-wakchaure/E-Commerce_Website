<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        SmartCart - Your Online Shopping Destination
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ============================= -->
<!-- HEADER -->
<!-- ============================= -->

<header class="header">

    <div class="nav-container">


        <!-- LOGO -->

        <a
            href="#"
            class="logo"
            onclick="showPage('home')"
        >
            SmartCart
        </a>


        <!-- SEARCH -->

        <div class="search-bar">

            <input
                type="text"
                id="searchInput"
                placeholder="Search Products.."
            >

            <button>
                Search
            </button>

        </div>


        <!-- NAVIGATION -->

        <div class="nav-actions">


            <!-- ACCOUNT -->

            <a
                href="#"
                class="nav-btn"
                onclick="showPage('account')"
            >
                👤 Account
            </a>


            <!-- CART -->

            <a
                href="#"
                class="nav-btn"
                onclick="showPage('cart')"
            >
                🛒 Cart
                (<span id="cartCount">0</span>)
            </a>


            <!-- ORDERS -->

            <a
                href="#"
                class="nav-btn"
                onclick="showPage('orders')"
            >
                📦 Orders
            </a>

        </div>

    </div>

</header>



<!-- ============================= -->
<!-- MAIN CONTENT -->
<!-- ============================= -->

<main class="main-content">


    <!-- ============================= -->
    <!-- HOME PAGE -->
    <!-- ============================= -->

    <div
        id="homePage"
        class="page"
    >

        <!-- HERO -->

        <section class="hero">

            <div class="hero-content">

                <h1>
                    Welcome to SmartCart
                </h1>

                <p>
                    Your one-stop online shopping destination
                    for all your needs.
                </p>

                <a
                    href="#categories"
                    class="hero-btn"
                >
                    Shop Now
                </a>

            </div>

        </section>


        <!-- CATEGORIES -->

        <section
            class="categories"
            id="categories"
        >

            <div class="container">

                <h2>
                    Shop by Category
                </h2>


                <div
                    class="category-grid"
                    id="categoryGrid"
                >
                    <!-- Categories will be loaded by JavaScript -->
                </div>

            </div>

        </section>

    </div>



    <!-- ============================= -->
    <!-- CATEGORY PAGE -->
    <!-- ============================= -->

    <div
        id="categoryPage"
        class="page hidden"
    >

        <div class="container">


            <h1 id="categoryTitle">
                Products
            </h1>


            <!-- FILTER SECTION -->

            <div class="filter-section">

                <div class="filter-row">


                    <!-- SORT -->

                    <div class="filter-group">

                        <label for="sortBy">
                            Sort By:
                        </label>


                        <select
                            id="sortBy"
                            onchange="applyFilters()"
                        >

                            <option value="relevance">
                                Relevance
                            </option>

                            <option value="price-low">
                                Price: Low to High
                            </option>

                            <option value="price-high">
                                Price: High to Low
                            </option>

                            <option value="rating">
                                Rating
                            </option>

                        </select>

                    </div>


                    <!-- PRICE -->

                    <div class="filter-group">

                        <label for="priceRange">
                            Max Price:
                        </label>


                        <input
                            type="range"
                            id="priceRange"
                            min="0"
                            max="10000"
                            value="10000"
                            onchange="applyFilters()"
                        >


                        <span id="priceValue">
                            ₹10000
                        </span>

                    </div>


                    <!-- BRAND -->

                    <div class="filter-group">

                        <label for="brandFilter">
                            Brand:
                        </label>


                        <select
                            id="brandFilter"
                            onchange="applyFilters()"
                        >

                            <option value="">
                                All Brands
                            </option>

                        </select>

                    </div>

                </div>

            </div>


            <!-- PRODUCT GRID -->

            <div
                class="product-grid"
                id="productGrid"
            >
            </div>

        </div>

    </div>



    <!-- ============================= -->
    <!-- PRODUCT PAGE -->
    <!-- ============================= -->

    <div
        id="productPage"
        class="page hidden"
    >

        <div class="container">

            <div
                class="product-detail"
                id="productDetail"
            >
            </div>

        </div>

    </div>



    <!-- ============================= -->
    <!-- CART PAGE -->
    <!-- ============================= -->

    <div
        id="cartPage"
        class="page hidden"
    >

        <div class="container">


            <h1>
                My Cart
            </h1>


            <!-- CART ITEMS -->

            <div id="cartItems">
            </div>


            <!-- CART SUMMARY -->

            <div
                class="cart-summary"
                id="cartSummary"
            >
            </div>

        </div>

    </div>

    <div
        id="orderPage"
        class="page hidden"
    >

        <div class="container">


            <h1>
                Place Order
            </h1>

            <div id="orderSteps">
            </div>
        </div>
    </div>

    <!-- ============================= -->
    <!-- ACCOUNT PAGE -->
    <!-- ============================= -->

    <div
        id="accountPage"
        class="page hidden"
    >

        <div class="container">


            <h1>
                My Account
            </h1>


            <div id="accountContent">
            </div>

        </div>

    </div>



    <!-- ============================= -->
    <!-- ORDERS PAGE -->
    <!-- ============================= -->

    <div
        id="ordersPage"
        class="page hidden">
       <div class="container">
            <h1>
                My Orders
            </h1>
            <div id="ordersList">
            </div>

        </div>

    </div>

    <!-- ============================= -->
    <!-- CHECKOUT / ORDER PAGE -->
    <!-- ============================= -->

    <div
        id="orderPage"
        class="page hidden"
    >

        <div class="container">


            <h1>
                Checkout
            </h1>


            <div id="orderContent">
            </div>

        </div>

    </div>


</main>



<!-- ============================= -->
<!-- JAVASCRIPT -->
<!-- ============================= -->

<script src="script.js"></script>


</body>

</html>
