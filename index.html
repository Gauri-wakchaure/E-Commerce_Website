
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartCart - Your Online Shopping Destination</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="nav-container">

            <a href="#" class="logo" onclick="showPage('home'); return false;">
                SmartCart
            </a>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search products...">
                <button type="button" onclick="searchProducts()">Search</button>
            </div>

            <div class="nav-actions">
                <a href="#" class="nav-btn" onclick="showPage('account'); return false;">
                    👤 Account
                </a>

                <a href="#" class="nav-btn" onclick="showPage('cart'); return false;">
                    🛒 Cart (<span id="cartCount">0</span>)
                </a>

                <a href="#" class="nav-btn" onclick="showPage('orders'); return false;">
                    📦 Orders
                </a>
            </div>

        </div>
    </header>

    <main class="main-content">

        <!-- HOME PAGE -->
        <section id="homePage" class="page">

            <section class="hero">
                <div class="hero-content">
                    <h1>Welcome to SmartCart</h1>
                    <p>Your one-stop online shopping destination for all your needs.</p>
                    <a href="#categories" class="hero-btn">Shop Now</a>
                </div>
            </section>

            <section class="categories" id="categories">
                <div class="container">
                    <h2>Shop by Category</h2>
                    <div class="category-grid" id="categoryGrid"></div>
                </div>
            </section>

        </section>

        <!-- CATEGORY PAGE -->
        <section id="categoryPage" class="page hidden">
            <div class="container">
                <h1 id="categoryTitle">Products</h1>

                <div class="filter-section">
                    <div class="filter-row">

                        <div class="filter-group">
                            <label for="sortBy">Sort By:</label>
                            <select id="sortBy" onchange="applyFilters()">
                                <option value="relevance">Relevance</option>
                                <option value="price-low">Price: Low to High</option>
                                <option value="price-high">Price: High to Low</option>
                                <option value="rating">Rating</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="priceRange">Max Price:</label>
                            <input type="range" id="priceRange"
                                   min="0" max="10000" value="10000"
                                   oninput="applyFilters()">
                            <span id="priceValue">₹10000</span>
                        </div>

                        <div class="filter-group">
                            <label for="brandFilter">Brand:</label>
                            <select id="brandFilter" onchange="applyFilters()">
                                <option value="">All Brands</option>
                            </select>
                        </div>

                    </div>
                </div>

                <div class="product-grid" id="productGrid"></div>
            </div>
        </section>

        <!-- PRODUCT DETAILS PAGE -->
        <section id="productPage" class="page hidden">
            <div class="container">
                <div class="product-detail" id="productDetail"></div>
            </div>
        </section>

        <!-- CART PAGE -->
        <section id="cartPage" class="page hidden">
            <div class="container">
                <h1>My Cart</h1>

                <div id="cartItems" class="cart-items"></div>
                <div class="cart-summary" id="cartSummary"></div>
            </div>
        </section>

        <!-- CHECKOUT PAGE: ONE ID ONLY -->
        <section id="orderPage" class="page hidden">
            <div class="container">
                <h1>Checkout</h1>
                <div id="orderSteps"></div>
            </div>
        </section>

        <!-- ACCOUNT PAGE -->
        <section id="accountPage" class="page hidden">
            <div class="container">
                <h1>My Account</h1>
                <div id="accountContent"></div>
            </div>
        </section>

        <!-- ORDERS PAGE -->
        <section id="ordersPage" class="page hidden">
            <div class="container">
                <h1>My Orders</h1>
                <div id="ordersList"></div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
